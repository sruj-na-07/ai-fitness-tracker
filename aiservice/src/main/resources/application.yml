spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
        default-requeue-rejected: false




eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/


# RabbitMQ custom properties
rabbitmq:
  exchange:
    name: fitness.exchange

  queue:
    name: activity.queue

  routing:
    key: activity.tracking


# Groq API configuration
groq:
  api:
    url: ${GROQ_API_URL}
    key: ${GROQ_API_KEY}


  model: openai/gpt-oss-20b