spring:
  application:
    name: activity-service

  mongodb:
    uri: mongodb://localhost:27017/fitnessactivity

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest


server:
  port: 8082

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

#      These properties help us to configure our application with rabbitMQ
rabbitmq:
  exchange:
    name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: activity.tracking


